name: XBattle 3D Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: xbattle-android
  cancel-in-progress: false

env:
  APP_NAME: XBattle
  PACKAGE: com.xbattle.game
  ANDROID_API: "34"
  BUILD_TOOLS: "34.0.0"
  NDK_VERSION: "28.2.13676358"
  RAYLIB_TAG: "5.5"

jobs:

  prepare:
    name: Prepare XBattle Source Tree
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 1. DIRECTORY STRUCTURE
      # ============================================================
      - name: Create complete game directories
        run: |
          mkdir -p \
            .github/workflows \
            src \
            tools \
            android/src/main/res/values \
            assets/models/player \
            assets/models/zombies \
            assets/models/weapons \
            assets/models/vehicles \
            assets/models/buildings \
            assets/models/environment \
            assets/textures \
            assets/audio \
            assets/shaders \
            assets/maps

          touch assets/models/player/.gitkeep
          touch assets/models/zombies/.gitkeep
          touch assets/models/weapons/.gitkeep
          touch assets/models/vehicles/.gitkeep
          touch assets/models/buildings/.gitkeep
          touch assets/models/environment/.gitkeep
          touch assets/textures/.gitkeep
          touch assets/audio/.gitkeep
          touch assets/shaders/.gitkeep
          touch assets/maps/.gitkeep

      # ============================================================
      # 2. ANDROID MANIFEST (FIXED FOR MODERN ANDROID)
      # ============================================================
      - name: Create AndroidManifest.xml
        run: |
          mkdir -p android/src/main

          cat > android/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.xbattle.game"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-sdk
                  android:minSdkVersion="24"
                  android:targetSdkVersion="34" />

              <uses-feature
                  android:glEsVersion="0x00020000"
                  android:required="true" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="true" />

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/XBattleTheme"
                  android:label="XBattle"
                  android:hasCode="false"
                  android:extractNativeLibs="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name="android.app.NativeActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">

                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="main" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ============================================================
      # 3. ANDROID RESOURCES
      # ============================================================
      - name: Create Android resources
        run: |
          mkdir -p android/src/main/res/values

          cat > android/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">XBattle</string>
          </resources>
          EOF

          cat > android/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style
                  name="XBattleTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

      # ============================================================
      # 4. CMAKE CONFIGURATION
      # ============================================================
      - name: Create CMakeLists.txt
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)

          project(XBattle C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(BUILD_GAMES OFF CACHE BOOL "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(PLATFORM "Android" CACHE STRING "" FORCE)
          set(GRAPHICS "GRAPHICS_API_OPENGL_ES2" CACHE STRING "" FORCE)

          include(FetchContent)

          FetchContent_Declare(
              raylib
              URL https://github.com/raysan5/raylib/archive/refs/tags/5.5.tar.gz
              DOWNLOAD_EXTRACT_TIMESTAMP TRUE
          )

          FetchContent_MakeAvailable(raylib)

          file(
              GLOB_RECURSE
              GAME_SOURCES
              CONFIGURE_DEPENDS
              ${CMAKE_SOURCE_DIR}/src/*.cpp
          )

          add_library(
              main
              SHARED
              ${GAME_SOURCES}
          )

          target_include_directories(
              main
              PRIVATE
              ${CMAKE_SOURCE_DIR}/src
          )

          target_compile_definitions(
              main
              PRIVATE
              PLATFORM_ANDROID
              GRAPHICS_API_OPENGL_ES2
          )

          target_compile_options(
              main
              PRIVATE
              -O3
              -ffast-math
              -fdata-sections
              -ffunction-sections
          )

          target_link_options(
              main
              PRIVATE
              -Wl,--gc-sections
              -Wl,--strip-all
              -Wl,-u,ANativeActivity_onCreate
          )

          target_link_libraries(
              main
              raylib
              android
              log
              EGL
              GLESv2
              OpenSLES
              dl
              m
          )

          set_target_properties(
              main
              PROPERTIES
              OUTPUT_NAME "main"
          )
          EOF

      # ============================================================
      # 5. RAYLIB VIRTUAL PAK SYSTEM HEADER (src/pak.h)
      # ============================================================
      - name: Create src/pak.h
        run: |
          cat > src/pak.h <<'EOF'
          #ifndef PAK_SYSTEM_H
          #define PAK_SYSTEM_H

          #include "raylib.h"
          #include <cstring>
          #include <vector>
          #include <string>

          #define PAK_MAGIC "XPAK"
          #define MAX_PAK_PATH 128

          #pragma pack(push, 1)
          struct PakHeader
          {
              char magic[4];
              unsigned int fileCount;
          };

          struct PakEntry
          {
              char path[MAX_PAK_PATH];
              unsigned int offset;
              unsigned int size;
          };
          #pragma pack(pop)

          static unsigned char *g_PakData = nullptr;
          static int g_PakSize = 0;
          static std::vector<PakEntry> g_PakEntries;

          static unsigned char *PakLoadFileDataCallback(const char *fileName, int *dataSize)
          {
              if (g_PakData && !g_PakEntries.empty())
              {
                  std::string search = fileName;
                  for (char &c : search) if (c == '\\') c = '/';
                  if (search.rfind("assets/", 0) == 0) search = search.substr(7);

                  for (const auto &entry : g_PakEntries)
                  {
                      if (search == entry.path)
                      {
                          if (entry.offset + entry.size <= (unsigned int)g_PakSize)
                          {
                              unsigned char *buffer = (unsigned char *)RL_MALLOC(entry.size);
                              if (buffer)
                              {
                                  memcpy(buffer, g_PakData + entry.offset, entry.size);
                                  *dataSize = (int)entry.size;
                                  return buffer;
                              }
                          }
                      }
                  }
              }

              // Recursion safe fallback to default raylib loader
              SetLoadFileDataCallback(nullptr);
              unsigned char *result = LoadFileData(fileName, dataSize);
              SetLoadFileDataCallback(PakLoadFileDataCallback);
              return result;
          }

          static bool InitPakSystem(const char *pakFileName)
          {
              if (!FileExists(pakFileName)) return false;

              g_PakData = LoadFileData(pakFileName, &g_PakSize);
              if (!g_PakData || g_PakSize < (int)sizeof(PakHeader)) return false;

              PakHeader header;
              memcpy(&header, g_PakData, sizeof(PakHeader));

              if (strncmp(header.magic, PAK_MAGIC, 4) != 0)
              {
                  UnloadFileData(g_PakData);
                  g_PakData = nullptr;
                  return false;
              }

              unsigned int tableOffset = sizeof(PakHeader);
              g_PakEntries.resize(header.fileCount);

              for (unsigned int i = 0; i < header.fileCount; ++i)
              {
                  memcpy(&g_PakEntries[i], g_PakData + tableOffset, sizeof(PakEntry));
                  tableOffset += sizeof(PakEntry);
              }

              SetLoadFileDataCallback(PakLoadFileDataCallback);
              TraceLog(LOG_INFO, "PAK: Mounted %s (%d files)", pakFileName, header.fileCount);
              return true;
          }

          static void ClosePakSystem()
          {
              if (g_PakData)
              {
                  UnloadFileData(g_PakData);
                  g_PakData = nullptr;
              }
              g_PakEntries.clear();
          }

          static bool FileExistsInPak(const char *fileName)
          {
              std::string search = fileName;
              for (char &c : search) if (c == '\\') c = '/';
              if (search.rfind("assets/", 0) == 0) search = search.substr(7);

              for (const auto &entry : g_PakEntries)
              {
                  if (search == entry.path) return true;
              }
              return FileExists(fileName);
          }

          #endif
          EOF

      # ============================================================
      # 6. STANDALONE RESOURCE PACKER TOOL (tools/packer.cpp)
      # ============================================================
      - name: Create tools/packer.cpp
        run: |
          cat > tools/packer.cpp <<'EOF'
          #include <iostream>
          #include <fstream>
          #include <vector>
          #include <string>
          #include <filesystem>
          #include <cstring>

          namespace fs = std::filesystem;

          #define PAK_MAGIC "XPAK"
          #define MAX_PAK_PATH 128

          #pragma pack(push, 1)
          struct PakHeader
          {
              char magic[4];
              unsigned int fileCount;
          };

          struct PakEntry
          {
              char path[MAX_PAK_PATH];
              unsigned int offset;
              unsigned int size;
          };
          #pragma pack(pop)

          int main(int argc, char* argv[])
          {
              std::string assetsDir = (argc > 1) ? argv[1] : "assets";
              std::string outputFile = (argc > 2) ? argv[2] : "game.pak";

              std::vector<fs::path> filePaths;
              if (fs::exists(assetsDir))
              {
                  for (const auto &entry : fs::recursive_directory_iterator(assetsDir))
                  {
                      if (fs::is_regular_file(entry.path()))
                      {
                          std::string ext = entry.path().extension().string();
                          if (ext != ".gitkeep")
                          {
                              filePaths.push_back(entry.path());
                          }
                      }
                  }
              }

              std::cout << "[PACKER] Packaging " << filePaths.size() << " files into " << outputFile << "...\n";

              std::vector<PakEntry> entries;
              std::vector<std::vector<char>> fileBuffers;
              unsigned int dataOffset = sizeof(PakHeader) + (filePaths.size() * sizeof(PakEntry));

              for (const auto &p : filePaths)
              {
                  std::ifstream file(p, std::ios::binary | std::ios::ate);
                  if (!file.is_open()) continue;

                  size_t size = file.tellg();
                  file.seekg(0, std::ios::beg);

                  std::vector<char> buffer(size);
                  file.read(buffer.data(), size);

                  std::string relPath = fs::relative(p, assetsDir).generic_string();

                  PakEntry entry;
                  std::memset(&entry, 0, sizeof(PakEntry));
                  std::strncpy(entry.path, relPath.c_str(), MAX_PAK_PATH - 1);
                  entry.offset = dataOffset;
                  entry.size = (unsigned int)size;

                  entries.push_back(entry);
                  fileBuffers.push_back(std::move(buffer));

                  dataOffset += size;
              }

              std::ofstream out(outputFile, std::ios::binary);
              PakHeader header;
              std::memcpy(header.magic, PAK_MAGIC, 4);
              header.fileCount = (unsigned int)entries.size();

              out.write(reinterpret_cast<char*>(&header), sizeof(PakHeader));
              for (const auto &e : entries)
              {
                  out.write(reinterpret_cast<const char*>(&e), sizeof(PakEntry));
              }
              for (const auto &buf : fileBuffers)
              {
                  out.write(buf.data(), buf.size());
              }

              std::cout << "[PACKER] Package generated successfully (" << dataOffset << " bytes).\n";
              return 0;
          }
          EOF

      # ============================================================
      # 7. COMPLETE C++ SOURCE (src/main.cpp)
      # ============================================================
      - name: Create src/main.cpp
        run: |
          cat > src/main.cpp <<'EOF'
          #include "raylib.h"
          #include "raymath.h"
          #include "pak.h"

          #include <vector>
          #include <cmath>

          struct Player
          {
              Vector3 position{ 0.0f, 0.0f, 0.0f };
              float yaw = 0.0f;
              float health = 100.0f;
              float speed = 7.0f;
              int ammo = 60;
              float shootCooldown = 0.0f;
          };

          struct Zombie
          {
              Vector3 position;
              float health = 100.0f;
              float speed = 1.4f;
              bool alive = true;
          };

          struct Bullet
          {
              Vector3 position;
              Vector3 velocity;
              float life = 2.0f;
              bool alive = true;
          };

          struct SmartAssets
          {
              Model mapModel;
              bool hasMap = false;

              Model playerModel;
              bool hasPlayer = false;

              Model zombieModel;
              bool hasZombie = false;
          };

          static Vector3 Forward(float yaw)
          {
              return Vector3{ std::sinf(yaw), 0.0f, std::cosf(yaw) };
          }

          static Vector3 Right(float yaw)
          {
              return Vector3{ std::cosf(yaw), 0.0f, -std::sinf(yaw) };
          }

          static void LoadSmartAssets(SmartAssets& assets)
          {
              if (FileExistsInPak("maps/map.glb"))
              {
                  assets.mapModel = LoadModel("maps/map.glb");
                  assets.hasMap = IsModelValid(assets.mapModel);
              }
              if (FileExistsInPak("models/player/player.glb"))
              {
                  assets.playerModel = LoadModel("models/player/player.glb");
                  assets.hasPlayer = IsModelValid(assets.playerModel);
              }
              if (FileExistsInPak("models/zombies/zombie.glb"))
              {
                  assets.zombieModel = LoadModel("models/zombies/zombie.glb");
                  assets.hasZombie = IsModelValid(assets.zombieModel);
              }
          }

          static void UnloadSmartAssets(SmartAssets& assets)
          {
              if (assets.hasMap) UnloadModel(assets.mapModel);
              if (assets.hasPlayer) UnloadModel(assets.playerModel);
              if (assets.hasZombie) UnloadModel(assets.zombieModel);
          }

          static void DrawProceduralTerrain()
          {
              DrawSphere(Vector3{ 50.0f, 60.0f, -70.0f }, 10.0f, Color{ 255, 240, 180, 255 });
              DrawPlane(Vector3{ 0, 0, 0 }, Vector2{ 300, 300 }, Color{ 55, 95, 45, 255 });
              DrawCube(Vector3{ 0, 0.02f, 0 }, 9.0f, 0.05f, 280.0f, Color{ 45, 45, 48, 255 });

              for (int x = -40; x <= 40; x += 25)
              {
                  for (int z = -40; z <= 40; z += 25)
                  {
                      if (x == 0 || z == 0) continue;
                      Vector3 bp{ (float)x, 2.5f, (float)z };
                      DrawCube(bp, 10.0f, 5.0f, 10.0f, Color{ 130, 125, 115, 255 });
                      DrawCubeWires(bp, 10.02f, 5.02f, 10.02f, Color{ 60, 55, 50, 255 });
                      DrawCube(Vector3{ bp.x, 5.5f, bp.z }, 10.5f, 1.0f, 10.5f, Color{ 90, 40, 30, 255 });
                  }
              }

              for (int i = 0; i < 40; ++i)
              {
                  float a = (float)i * 0.75f;
                  float r = 26.0f + (float)(i % 8) * 5.0f;
                  Vector3 tp{ std::cosf(a) * r, 2.0f, std::sinf(a) * r };
                  DrawCylinder(tp, 0.35f, 0.45f, 4.0f, 8, Color{ 65, 40, 25, 255 });
                  DrawSphere(Vector3{ tp.x, 5.2f, tp.z }, 2.3f, Color{ 35, 95, 40, 255 });
              }
          }

          static void DrawPlayerEntity(const Player& player, const SmartAssets& assets)
          {
              if (assets.hasPlayer)
              {
                  DrawModelEx(assets.playerModel, player.position, Vector3{ 0, 1, 0 }, (player.yaw * RAD2DEG) + 180.0f, Vector3{ 1.0f, 1.0f, 1.0f }, WHITE);
                  return;
              }

              Vector3 f = Forward(player.yaw);
              Vector3 r = Right(player.yaw);

              DrawCapsule(
                  Vector3{ player.position.x, player.position.y + 0.4f, player.position.z },
                  Vector3{ player.position.x, player.position.y + 1.4f, player.position.z },
                  0.42f, 8, 8, Color{ 35, 55, 85, 255 }
              );
              DrawCube(Vector3{ player.position.x, player.position.y + 1.1f, player.position.z }, 0.6f, 0.65f, 0.45f, Color{ 25, 30, 35, 255 });
              DrawSphere(Vector3{ player.position.x, player.position.y + 1.75f, player.position.z }, 0.32f, Color{ 40, 48, 40, 255 });
              DrawSphere(Vector3{ player.position.x + f.x * 0.15f, player.position.y + 1.68f, player.position.z + f.z * 0.15f }, 0.15f, Color{ 220, 175, 140, 255 });

              Vector3 gunPos = Vector3Add(player.position, Vector3{ r.x * 0.35f + f.x * 0.45f, 1.05f, r.z * 0.35f + f.z * 0.45f });
              DrawCube(gunPos, 0.12f, 0.15f, 0.75f, Color{ 20, 20, 20, 255 });
          }

          static void DrawZombieEntity(const Zombie& zombie, const SmartAssets& assets, const Player& player)
          {
              if (!zombie.alive) return;

              if (assets.hasZombie)
              {
                  Vector3 toPlayer = Vector3Subtract(player.position, zombie.position);
                  float zYaw = std::atan2f(toPlayer.x, toPlayer.z) * RAD2DEG;
                  DrawModelEx(assets.zombieModel, zombie.position, Vector3{ 0, 1, 0 }, zYaw, Vector3{ 1.0f, 1.0f, 1.0f }, WHITE);
                  return;
              }

              DrawCapsule(
                  Vector3{ zombie.position.x, zombie.position.y + 0.4f, zombie.position.z },
                  Vector3{ zombie.position.x, zombie.position.y + 1.4f, zombie.position.z },
                  0.42f, 8, 8, Color{ 105, 30, 30, 255 }
              );
              DrawSphere(Vector3{ zombie.position.x, zombie.position.y + 1.75f, zombie.position.z }, 0.34f, Color{ 75, 125, 75, 255 });
          }

          int main()
          {
              SetConfigFlags(FLAG_FULLSCREEN_MODE | FLAG_MSAA_4X_HINT);
              InitWindow(1280, 720, "XBattle");
              SetTargetFPS(60);

              InitPakSystem("game.pak");

              SmartAssets assets;
              LoadSmartAssets(assets);

              Player player;
              std::vector<Zombie> zombies;
              std::vector<Bullet> bullets;

              for (int i = 0; i < 14; ++i)
              {
                  float angle = ((float)i / 14.0f) * PI * 2.0f;
                  float radius = 16.0f + (float)(i % 4) * 4.0f;
                  zombies.push_back({ Vector3{ std::cosf(angle) * radius, 0.0f, std::sinf(angle) * radius } });
              }

              Camera3D camera{};
              camera.up = Vector3{ 0.0f, 1.0f, 0.0f };
              camera.fovy = 55.0f;
              camera.projection = CAMERA_PERSPECTIVE;

              Vector2 prevRightTouchPos{ 0, 0 };
              bool rightTouchActive = false;

              while (!WindowShouldClose())
              {
                  float dt = GetFrameTime();
                  int screenW = GetScreenWidth();
                  int screenH = GetScreenHeight();

                  Rectangle fireBtn{ (float)screenW - 140, (float)screenH - 140, 110, 110 };
                  Vector2 moveInput{ 0.0f, 0.0f };
                  bool fireTriggered = false;

                  int touchCount = GetTouchPointCount();
                  bool currentRightActive = false;

                  for (int i = 0; i < touchCount; ++i)
                  {
                      Vector2 tPos = GetTouchPosition(i);

                      if (CheckCollisionPointRec(tPos, fireBtn))
                      {
                          fireTriggered = true;
                          continue;
                      }

                      if (tPos.x < (float)screenW * 0.45f)
                      {
                          Vector2 center{ (float)screenW * 0.18f, (float)screenH * 0.72f };
                          Vector2 delta = Vector2Subtract(tPos, center);
                          if (Vector2Length(delta) > 15.0f)
                          {
                              moveInput = Vector2Normalize(delta);
                          }
                      }
                      else
                      {
                          currentRightActive = true;
                          if (rightTouchActive)
                          {
                              float deltaX = tPos.x - prevRightTouchPos.x;
                              player.yaw += deltaX * 0.006f;
                          }
                          prevRightTouchPos = tPos;
                      }
                  }
                  rightTouchActive = currentRightActive;

                  if (IsKeyDown(KEY_W)) moveInput.y -= 1.0f;
                  if (IsKeyDown(KEY_S)) moveInput.y += 1.0f;
                  if (IsKeyDown(KEY_A)) moveInput.x -= 1.0f;
                  if (IsKeyDown(KEY_D)) moveInput.x += 1.0f;
                  if (IsKeyDown(KEY_LEFT)) player.yaw -= 2.5f * dt;
                  if (IsKeyDown(KEY_RIGHT)) player.yaw += 2.5f * dt;
                  if (IsKeyDown(KEY_SPACE)) fireTriggered = true;

                  if (Vector2Length(moveInput) > 0.1f)
                  {
                      Vector2 norm = Vector2Normalize(moveInput);
                      Vector3 fwd = Forward(player.yaw);
                      Vector3 rgt = Right(player.yaw);
                      Vector3 dir = Vector3Add(Vector3Scale(fwd, -norm.y), Vector3Scale(rgt, norm.x));
                      player.position = Vector3Add(player.position, Vector3Scale(dir, player.speed * dt));
                  }

                  if (fireTriggered && player.shootCooldown <= 0.0f && player.ammo > 0)
                  {
                      Vector3 dir = Forward(player.yaw);
                      Vector3 spawn = Vector3Add(player.position, Vector3{ dir.x * 0.8f, 1.1f, dir.z * 0.8f });
                      bullets.push_back({ spawn, Vector3Scale(dir, 45.0f) });
                      player.ammo--;
                      player.shootCooldown = 0.15f;
                  }
                  if (player.shootCooldown > 0) player.shootCooldown -= dt;

                  for (auto& b : bullets)
                  {
                      if (!b.alive) continue;
                      b.position = Vector3Add(b.position, Vector3Scale(b.velocity, dt));
                      b.life -= dt;
                      if (b.life <= 0) b.alive = false;

                      for (auto& z : zombies)
                      {
                          if (z.alive && Vector3Distance(b.position, z.position) < 1.3f)
                          {
                              zombie.health -= 50;
                              b.alive = false;
                              if (zombie.health <= 0) zombie.alive = false;
                              break;
                          }
                      }
                  }

                  for (auto& z : zombies)
                  {
                      if (!z.alive) continue;
                      Vector3 dir = Vector3Subtract(player.position, z.position);
                      float dist = Vector3Length(dir);
                      if (dist > 1.4f)
                      {
                          dir = Vector3Normalize(dir);
                          z.position = Vector3Add(z.position, Vector3Scale(dir, z.speed * dt));
                      }
                      else
                      {
                          player.health -= 10.0f * dt;
                          if (player.health < 0) player.health = 0;
                      }
                  }

                  // PUBG TPS Over-the-shoulder Camera
                  Vector3 fwd = Forward(player.yaw);
                  Vector3 rgt = Right(player.yaw);
                  camera.position = Vector3Add(
                      player.position,
                      Vector3{
                          -fwd.x * 4.8f + rgt.x * 0.8f,
                          2.2f,
                          -fwd.z * 4.8f + rgt.z * 0.8f
                      }
                  );
                  camera.target = Vector3Add(player.position, Vector3{ fwd.x * 12.0f, 1.4f, fwd.z * 12.0f });

                  BeginDrawing();
                  ClearBackground(Color{ 115, 175, 230, 255 });

                  BeginMode3D(camera);

                  if (assets.hasMap)
                  {
                      DrawModel(assets.mapModel, Vector3{ 0, 0, 0 }, 1.0f, WHITE);
                  }
                  else
                  {
                      DrawProceduralTerrain();
                  }

                  for (const auto& z : zombies) DrawZombieEntity(z, assets, player);
                  DrawPlayerEntity(player, assets);

                  for (const auto& b : bullets)
                  {
                      if (b.alive) DrawSphere(b.position, 0.08f, YELLOW);
                  }

                  EndMode3D();

                  DrawCircle(screenW / 2, screenH / 2, 3.0f, Fade(WHITE, 0.85f));
                  DrawCircleLines(screenW / 2, screenH / 2, 8.0f, Fade(BLACK, 0.5f));

                  int hudMarginX = 50;
                  int hudMarginY = 35;
                  DrawRectangle(hudMarginX, hudMarginY, 210, 65, Fade(BLACK, 0.65f));
                  DrawText("XBATTLE 3D", hudMarginX + 15, hudMarginY + 10, 20, WHITE);
                  DrawText(TextFormat("HP: %d", (int)player.health), hudMarginX + 15, hudMarginY + 36, 18, (player.health > 25 ? GREEN : RED));

                  DrawRectangle(screenW - 175, hudMarginY, 125, 45, Fade(BLACK, 0.65f));
                  DrawText(TextFormat("AMMO: %d", player.ammo), screenW - 160, hudMarginY + 12, 20, YELLOW);

                  Vector2 dpadCenter{ (float)screenW * 0.18f, (float)screenH * 0.72f };
                  DrawCircleV(dpadCenter, 65.0f, Fade(WHITE, 0.15f));
                  DrawCircleLines(dpadCenter.x, dpadCenter.y, 65.0f, Fade(WHITE, 0.4f));
                  DrawCircleV(Vector2Add(dpadCenter, Vector2Scale(moveInput, 38.0f)), 26.0f, Fade(SKYBLUE, 0.6f));

                  DrawCircle(fireBtn.x + 55, fireBtn.y + 55, 50, Fade(MAROON, 0.75f));
                  DrawCircleLines(fireBtn.x + 55, fireBtn.y + 55, 50, WHITE);
                  DrawText("FIRE", fireBtn.x + 33, fireBtn.y + 44, 20, WHITE);

                  EndDrawing();
              }

              UnloadSmartAssets(assets);
              ClosePakSystem();
              CloseWindow();
              return 0;
          }
          EOF

      # ============================================================
      # 8. GITIGNORE
      # ============================================================
      - name: Create gitignore
        run: |
          cat > .gitignore <<'EOF'
          build/
          .cxx/
          .gradle/
          local.properties
          *.apk
          *.aab
          *.keystore
          *.jks
          *.o
          *.so
          CMakeCache.txt
          CMakeFiles/
          cmake_install.cmake
          Makefile
          EOF

      # ============================================================
      # 9. COMMIT GENERATED FILES
      # ============================================================
      - name: Commit generated files
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Initialize complete XBattle source and PAK engine [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  build:
    name: Build XBattle APK
    needs: prepare
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pre-seed Android Licenses to prevent interactive hang
      - name: Setup Android SDK & Licenses
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          mkdir -p "$ANDROID_HOME/licenses"

          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a3f8e447306ff971e50958aac60" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n856480a309620326dd8ca63ad49514c9203263dd" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "\n84831b9409646a3f8e447306ff971e50958aac60" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n7912072950560f78d3652693c7407cb617e6377f" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "\n601085b94cd77f0b54ff86406957099fed7926e0" > "$ANDROID_HOME/licenses/google-gdk-license"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" || true

      - name: Setup NDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          if [ ! -d "$ANDROID_HOME/ndk/${NDK_VERSION}" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" || true
          fi

          if [ -d "$ANDROID_HOME/ndk/${NDK_VERSION}" ]; then
            TARGET_NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          else
            TARGET_NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          fi

          echo "ANDROID_NDK_HOME=$TARGET_NDK" >> $GITHUB_ENV

      - name: Install Ninja Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      # ============================================================
      # BUILD GAME.PAK RESOURCE PACKAGE
      # ============================================================
      - name: Compile Packer and Build game.pak
        run: |
          g++ -std=c++17 -O2 tools/packer.cpp -o tools/packer
          ./tools/packer assets game.pak
          ls -lh game.pak

      # ============================================================
      # COMPILE NATIVE C++ ENGINE
      # ============================================================
      - name: Configure and Build C++ Engine
        run: |
          cmake \
            -S . \
            -B build/android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DANDROID_STL=c++_static \
            -DPLATFORM=Android

          cmake --build build/android --config Release --parallel $(nproc)

      # ============================================================
      # PACKAGE & SIGN ANDROID 14/15 COMPATIBLE APK
      # ============================================================
      - name: Package Compatible APK
        run: |
          set -eux
          rm -rf apk
          mkdir -p apk/lib/arm64-v8a apk/assets apk/res/values

          cp build/android/libmain.so apk/lib/arm64-v8a/libmain.so
          cp android/src/main/AndroidManifest.xml apk/AndroidManifest.xml
          cp android/src/main/res/values/* apk/res/values/

          # Mount game.pak into root assets
          cp game.pak apk/assets/game.pak

          # Backward compatible loose files
          if [ -d assets ]; then
            cp -r assets/* apk/assets/ 2>/dev/null || true
          fi

          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | tail -n 1)
          PLATFORM_JAR=$(ls /usr/local/lib/android/sdk/platforms/*/android.jar 2>/dev/null | tail -n 1)

          "$BT/aapt" package \
            -f \
            -M apk/AndroidManifest.xml \
            -S apk/res \
            -A apk/assets \
            -I "$PLATFORM_JAR" \
            -F XBattle-unsigned.apk

          cd apk
          "$BT/aapt" add ../XBattle-unsigned.apk lib/arm64-v8a/libmain.so
          cd ..

          keytool -genkeypair -v -keystore xbattle.jks -storetype JKS -alias xbattle \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=XBattle,O=Game,C=IN"

          "$BT/zipalign" -f -p 4 XBattle-unsigned.apk XBattle-aligned.apk

          "$BT/apksigner" sign --ks xbattle.jks --ks-key-alias xbattle \
            --ks-pass pass:android --key-pass pass:android --out XBattle.apk XBattle-aligned.apk

          "$BT/apksigner" verify --verbose XBattle.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XBattle-Android-arm64
          path: XBattle.apk
          if-no-files-found: error
          retention-days: 7
