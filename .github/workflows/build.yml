name: XBattle 3D Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: xbattle-android
  cancel-in-progress: false

env:
  APP_NAME: XBattle
  PACKAGE: com.xbattle.game
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "28.2.13676358"
  RAYLIB_TAG: "5.5"

jobs:

  prepare:
    name: Prepare XBattle source tree
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # DIRECTORY STRUCTURE
      # ============================================================
      - name: Create complete game directories
        run: |
          mkdir -p \
            .github/workflows \
            src \
            android/src/main/res/values \
            assets/models/player \
            assets/models/zombies \
            assets/models/weapons \
            assets/models/vehicles \
            assets/models/buildings \
            assets/models/environment \
            assets/textures/player \
            assets/textures/zombies \
            assets/textures/weapons \
            assets/textures/terrain \
            assets/textures/buildings \
            assets/textures/environment \
            assets/materials \
            assets/animations \
            assets/audio/music \
            assets/audio/weapons \
            assets/audio/footsteps \
            assets/audio/environment \
            assets/shaders \
            assets/maps \
            assets/fonts

          touch assets/models/player/.gitkeep
          touch assets/models/zombies/.gitkeep
          touch assets/models/weapons/.gitkeep
          touch assets/models/vehicles/.gitkeep
          touch assets/models/buildings/.gitkeep
          touch assets/models/environment/.gitkeep
          touch assets/textures/player/.gitkeep
          touch assets/textures/zombies/.gitkeep
          touch assets/textures/weapons/.gitkeep
          touch assets/textures/terrain/.gitkeep
          touch assets/textures/buildings/.gitkeep
          touch assets/textures/environment/.gitkeep
          touch assets/materials/.gitkeep
          touch assets/animations/.gitkeep
          touch assets/audio/music/.gitkeep
          touch assets/audio/weapons/.gitkeep
          touch assets/audio/footsteps/.gitkeep
          touch assets/audio/environment/.gitkeep
          touch assets/shaders/.gitkeep
          touch assets/maps/.gitkeep
          touch assets/fonts/.gitkeep

      # ============================================================
      # ANDROID MANIFEST
      # ============================================================
      - name: Create AndroidManifest.xml
        run: |
          mkdir -p android/src/main

          cat > android/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.xbattle.game"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-feature
                  android:glEsVersion="0x00020000"
                  android:required="true" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="true" />

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/XBattleTheme"
                  android:label="XBattle"
                  android:hasCode="false"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name="android.app.NativeActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="main" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ============================================================
      # ANDROID RESOURCES
      # ============================================================
      - name: Create Android resources
        run: |
          mkdir -p android/src/main/res/values

          cat > android/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">XBattle</string>
          </resources>
          EOF

          cat > android/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style
                  name="XBattleTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

      # ============================================================
      # CMAKE
      # ============================================================
      - name: Create CMakeLists.txt
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)

          project(XBattle C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(BUILD_GAMES OFF CACHE BOOL "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(PLATFORM "Android" CACHE STRING "" FORCE)
          set(GRAPHICS "GRAPHICS_API_OPENGL_ES2" CACHE STRING "" FORCE)

          include(FetchContent)

          FetchContent_Declare(
              raylib
              URL https://github.com/raysan5/raylib/archive/refs/tags/5.5.tar.gz
              DOWNLOAD_EXTRACT_TIMESTAMP TRUE
          )

          FetchContent_MakeAvailable(raylib)

          file(
              GLOB_RECURSE
              GAME_SOURCES
              CONFIGURE_DEPENDS
              ${CMAKE_SOURCE_DIR}/src/*.cpp
          )

          add_library(
              main
              SHARED
              ${GAME_SOURCES}
          )

          target_include_directories(
              main
              PRIVATE
              ${CMAKE_SOURCE_DIR}/src
          )

          target_compile_definitions(
              main
              PRIVATE
              PLATFORM_ANDROID
              GRAPHICS_API_OPENGL_ES2
          )

          target_compile_options(
              main
              PRIVATE
              -O3
              -ffast-math
              -fdata-sections
              -ffunction-sections
          )

          target_link_options(
              main
              PRIVATE
              -Wl,--gc-sections
              -Wl,--strip-all
              -Wl,-u,ANativeActivity_onCreate
          )

          target_link_libraries(
              main
              raylib
              android
              log
              EGL
              GLESv2
              OpenSLES
              dl
              m
          )

          set_target_properties(
              main
              PROPERTIES
              OUTPUT_NAME "main"
          )
          EOF

      # ============================================================
      # COMPLETE C++ 3D GAME SOURCE (WITH MOBILE TOUCH CONTROLS)
      # ============================================================
      - name: Create main.cpp
        run: |
          cat > src/main.cpp <<'EOF'
          #include "raylib.h"
          #include "raymath.h"

          #include <vector>
          #include <cmath>
          #include <cstdlib>

          struct Player
          {
              Vector3 position{0.0f, 1.0f, 0.0f};
              float yaw = 0.0f;
              float health = 100.0f;
              float speed = 6.0f;
              int ammo = 45;
              float shootCooldown = 0.0f;
          };

          struct Zombie
          {
              Vector3 position;
              float health = 100.0f;
              float speed = 1.35f;
              bool alive = true;
          };

          struct Bullet
          {
              Vector3 position;
              Vector3 velocity;
              float life = 2.0f;
              bool alive = true;
          };

          static Vector3 Forward(float yaw)
          {
              return Vector3{
                  std::sinf(yaw),
                  0.0f,
                  std::cosf(yaw)
              };
          }

          static Vector3 Right(float yaw)
          {
              return Vector3{
                  std::cosf(yaw),
                  0.0f,
                  -std::sinf(yaw)
              };
          }

          static void SpawnZombies(std::vector<Zombie>& zombies)
          {
              zombies.clear();
              for (int i = 0; i < 14; ++i)
              {
                  float angle = ((float)i / 14.0f) * PI * 2.0f;
                  float radius = 14.0f + (float)(i % 4) * 4.5f;

                  Zombie z;
                  z.position = {
                      std::cosf(angle) * radius,
                      1.0f,
                      std::sinf(angle) * radius
                  };
                  zombies.push_back(z);
              }
          }

          static void DrawWorld()
          {
              DrawPlane(Vector3{0, 0, 0}, Vector2{140, 140}, Color{68, 98, 64, 255});
              DrawCube(Vector3{0, 0.02f, 0}, 8, 0.05f, 140, Color{60, 60, 60, 255});

              for (int x = -30; x <= 30; x += 20)
              {
                  for (int z = -30; z <= 30; z += 20)
                  {
                      if (x == 0 || z == 0) continue;
                      Vector3 p{(float)x, 2.0f, (float)z};
                      DrawCube(p, 8, 4, 8, Color{145, 140, 125, 255});
                      DrawCube(Vector3{p.x, 4.5f, p.z}, 8.5f, 1.0f, 8.5f, Color{90, 45, 35, 255});
                  }
              }

              for (int i = 0; i < 35; ++i)
              {
                  float a = (float)i * 0.75f;
                  float r = 24.0f + (float)(i % 7) * 4.5f;
                  Vector3 p{std::cosf(a) * r, 2.0f, std::sinf(a) * r};

                  DrawCylinder(p, 0.25f, 0.35f, 4.0f, 8, Color{75, 45, 30, 255});
                  DrawSphere(Vector3{p.x, 5.0f, p.z}, 1.9f, Color{40, 95, 45, 255});
              }
          }

          static void DrawPlayer(const Player& player)
          {
              DrawCapsule(
                  Vector3{player.position.x, player.position.y - 0.5f, player.position.z},
                  Vector3{player.position.x, player.position.y + 1.0f, player.position.z},
                  0.45f, 8, 8, BLUE
              );

              Vector3 f = Forward(player.yaw);
              DrawSphere(
                  Vector3{player.position.x + f.x * 0.65f, player.position.y + 0.9f, player.position.z + f.z * 0.65f},
                  0.35f, BEIGE
              );
          }

          static void DrawZombie(const Zombie& zombie)
          {
              if (!zombie.alive) return;

              DrawCapsule(
                  Vector3{zombie.position.x, 0.5f, zombie.position.z},
                  Vector3{zombie.position.x, 2.0f, zombie.position.z},
                  0.45f, 8, 8, MAROON
              );

              DrawSphere(
                  Vector3{zombie.position.x, 2.35f, zombie.position.z},
                  0.42f, Color{100, 150, 100, 255}
              );
          }

          static void Shoot(Player& player, std::vector<Bullet>& bullets)
          {
              if (player.shootCooldown > 0.0f || player.ammo <= 0) return;

              Vector3 direction = Forward(player.yaw);
              Bullet bullet;
              bullet.position = Vector3Add(player.position, Vector3{direction.x * 1.0f, 0.3f, direction.z * 1.0f});
              bullet.velocity = Vector3Scale(direction, 40.0f);
              bullets.push_back(bullet);

              player.ammo--;
              player.shootCooldown = 0.15f;
          }

          int main()
          {
              SetConfigFlags(FLAG_FULLSCREEN_MODE | FLAG_MSAA_4X_HINT);
              InitWindow(1280, 720, "XBattle");
              SetTargetFPS(60);

              Player player;
              std::vector<Zombie> zombies;
              std::vector<Bullet> bullets;
              SpawnZombies(zombies);

              Camera3D camera{};
              camera.position = {0, 5, 8};
              camera.target = {0, 1, 0};
              camera.up = {0, 1, 0};
              camera.fovy = 60.0f;
              camera.projection = CAMERA_PERSPECTIVE;

              Vector2 prevRightTouchPos{0, 0};
              bool rightTouchActive = false;

              while (!WindowShouldClose())
              {
                  float dt = GetFrameTime();
                  int screenW = GetScreenWidth();
                  int screenH = GetScreenHeight();

                  Rectangle fireBtnRect{ (float)screenW - 140, (float)screenH - 140, 110, 110 };
                  Vector2 moveInput{0.0f, 0.0f};
                  bool fireTriggered = false;

                  int touchCount = GetTouchPointCount();
                  bool currentRightTouchActive = false;

                  for (int i = 0; i < touchCount; ++i)
                  {
                      Vector2 tPos = GetTouchPosition(i);

                      if (CheckCollisionPointRec(tPos, fireBtnRect))
                      {
                          fireTriggered = true;
                          continue;
                      }

                      if (tPos.x < (float)screenW * 0.45f)
                      {
                          Vector2 center{ (float)screenW * 0.18f, (float)screenH * 0.72f };
                          Vector2 delta = Vector2Subtract(tPos, center);
                          if (Vector2Length(delta) > 15.0f)
                          {
                              moveInput = Vector2Normalize(delta);
                          }
                      }
                      else if (tPos.x >= (float)screenW * 0.45f)
                      {
                          currentRightTouchActive = true;
                          if (rightTouchActive)
                          {
                              float deltaX = tPos.x - prevRightTouchPos.x;
                              player.yaw += deltaX * 0.006f;
                          }
                          prevRightTouchPos = tPos;
                      }
                  }
                  rightTouchActive = currentRightTouchActive;

                  if (IsKeyDown(KEY_W)) moveInput.y -= 1.0f;
                  if (IsKeyDown(KEY_S)) moveInput.y += 1.0f;
                  if (IsKeyDown(KEY_A)) moveInput.x -= 1.0f;
                  if (IsKeyDown(KEY_D)) moveInput.x += 1.0f;
                  if (IsKeyDown(KEY_LEFT)) player.yaw -= 2.5f * dt;
                  if (IsKeyDown(KEY_RIGHT)) player.yaw += 2.5f * dt;
                  if (IsKeyDown(KEY_SPACE)) fireTriggered = true;

                  if (Vector2Length(moveInput) > 0.1f)
                  {
                      Vector2 normInput = Vector2Normalize(moveInput);
                      Vector3 fwd = Forward(player.yaw);
                      Vector3 rgt = Right(player.yaw);

                      Vector3 dir = Vector3Add(
                          Vector3Scale(fwd, -normInput.y),
                          Vector3Scale(rgt, normInput.x)
                      );
                      player.position = Vector3Add(player.position, Vector3Scale(dir, player.speed * dt));
                  }

                  if (fireTriggered) Shoot(player, bullets);
                  if (player.shootCooldown > 0) player.shootCooldown -= dt;

                  for (auto& bullet : bullets)
                  {
                      if (!bullet.alive) continue;
                      bullet.position = Vector3Add(bullet.position, Vector3Scale(bullet.velocity, dt));
                      bullet.life -= dt;
                      if (bullet.life <= 0) bullet.alive = false;

                      for (auto& zombie : zombies)
                      {
                          if (!zombie.alive) continue;
                          if (Vector3Distance(bullet.position, zombie.position) < 1.25f)
                          {
                              zombie.health -= 50;
                              bullet.alive = false;
                              if (zombie.health <= 0) zombie.alive = false;
                              break;
                          }
                      }
                  }

                  for (auto& zombie : zombies)
                  {
                      if (!zombie.alive) continue;
                      Vector3 direction = Vector3Subtract(player.position, zombie.position);
                      float distance = Vector3Length(direction);

                      if (distance > 1.4f)
                      {
                          direction = Vector3Normalize(direction);
                          zombie.position = Vector3Add(zombie.position, Vector3Scale(direction, zombie.speed * dt));
                      }
                      else
                      {
                          player.health -= 12.0f * dt;
                          if (player.health < 0) player.health = 0;
                      }
                  }

                  Vector3 forward = Forward(player.yaw);
                  camera.position = Vector3Add(player.position, Vector3{-forward.x * 7.5f, 4.2f, -forward.z * 7.5f});
                  camera.target = Vector3Add(player.position, Vector3{0, 1.2f, 0});

                  BeginDrawing();
                  ClearBackground(Color{105, 165, 220, 255});

                  BeginMode3D(camera);
                  DrawWorld();
                  for (const auto& zombie : zombies) DrawZombie(zombie);
                  DrawPlayer(player);
                  for (const auto& bullet : bullets)
                  {
                      if (bullet.alive) DrawSphere(bullet.position, 0.09f, YELLOW);
                  }
                  EndMode3D();

                  DrawRectangle(20, 20, 230, 70, Fade(BLACK, 0.6f));
                  DrawText("XBATTLE 3D", 35, 30, 22, WHITE);
                  DrawText(TextFormat("HP: %d", (int)player.health), 35, 58, 20, (player.health > 30 ? GREEN : RED));
                  DrawText(TextFormat("AMMO: %d", player.ammo), screenW - 160, 25, 22, YELLOW);

                  Vector2 leftCenter{ (float)screenW * 0.18f, (float)screenH * 0.72f };
                  DrawCircleV(leftCenter, 65.0f, Fade(WHITE, 0.15f));
                  DrawCircleLines(leftCenter.x, leftCenter.y, 65.0f, Fade(WHITE, 0.4f));
                  DrawCircleV(Vector2Add(leftCenter, Vector2Scale(moveInput, 40.0f)), 28.0f, Fade(SKYBLUE, 0.5f));

                  DrawCircle(fireBtnRect.x + 55, fireBtnRect.y + 55, 50, Fade(MAROON, 0.7f));
                  DrawCircleLines(fireBtnRect.x + 55, fireBtnRect.y + 55, 50, WHITE);
                  DrawText("FIRE", fireBtnRect.x + 32, fireBtnRect.y + 44, 20, WHITE);

                  EndDrawing();
              }

              CloseWindow();
              return 0;
          }
          EOF

      # ============================================================
      # GITIGNORE
      # ============================================================
      - name: Create gitignore
        run: |
          cat > .gitignore <<'EOF'
          build/
          .cxx/
          .gradle/
          local.properties
          *.apk
          *.aab
          *.keystore
          *.jks
          *.o
          *.so
          CMakeCache.txt
          CMakeFiles/
          cmake_install.cmake
          Makefile
          EOF

      # ============================================================
      # COMMIT STRUCTURE
      # ============================================================
      - name: Commit generated files
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Initialize XBattle 3D Android project [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  build:
    name: Build XBattle APK
    needs: prepare
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ROBUST SDK & LICENSE SETUP (NO THIRD-PARTY ACTION HANGS)
      # ============================================================
      - name: Setup Android SDK and Accept Licenses
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # 1. Pre-accept all licenses directly on filesystem
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a3f8e447306ff971e50958aac60" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n856480a309620326dd8ca63ad49514c9203263dd" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "\n84831b9409646a3f8e447306ff971e50958aac60" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n7912072950560f78d3652693c7407cb617e6377f" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "\n601085b94cd77f0b54ff86406957099fed7926e0" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo -e "\ne67f269c35329453735e074229efc0b6473c8397" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"

          # 2. Automated non-interactive accept
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          # 3. Install required platform and build tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" || true

      # ============================================================
      # NDK SETUP WITH AUTO-FALLBACK
      # ============================================================
      - name: Setup Android NDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          if [ ! -d "$ANDROID_HOME/ndk/${NDK_VERSION}" ]; then
            echo "Installing NDK ${NDK_VERSION}..."
            yes | sdkmanager "ndk;${NDK_VERSION}" || true
          fi

          if [ -d "$ANDROID_HOME/ndk/${NDK_VERSION}" ]; then
            TARGET_NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          else
            TARGET_NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          fi

          echo "Using NDK path: $TARGET_NDK"
          echo "ANDROID_NDK_HOME=$TARGET_NDK" >> $GITHUB_ENV

      - name: Install Ninja Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Cache CMake and raylib
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            build/android/_deps
          key: xbattle-${{ runner.os }}-raylib-${{ env.RAYLIB_TAG }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            xbattle-${{ runner.os }}-raylib-${{ env.RAYLIB_TAG }}-
            xbattle-${{ runner.os }}-

      # ============================================================
      # CMAKE CONFIGURE & NATIVE BUILD
      # ============================================================
      - name: Configure native Android build
        run: |
          cmake \
            -S . \
            -B build/android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DANDROID_STL=c++_static \
            -DPLATFORM=Android

      - name: Compile C++ 3D engine
        run: |
          cmake \
            --build build/android \
            --config Release \
            --parallel $(nproc)

      # ============================================================
      # PREPARE APK
      # ============================================================
      - name: Prepare APK filesystem
        run: |
          set -eux
          rm -rf apk
          mkdir -p apk/lib/arm64-v8a apk/assets apk/res/values

          cp build/android/libmain.so apk/lib/arm64-v8a/libmain.so
          cp android/src/main/AndroidManifest.xml apk/AndroidManifest.xml
          cp android/src/main/res/values/* apk/res/values/

          if [ -d assets ]; then
            cp -r assets/* apk/assets/ 2>/dev/null || true
          fi

      # ============================================================
      # CREATE RESOURCE PACKAGE & SIGN
      # ============================================================
      - name: Build unsigned APK
        run: |
          set -eux
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          if [ ! -f "$BT/aapt" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | tail -n 1)
          fi

          PLATFORM_JAR="$ANDROID_HOME/platforms/android-${ANDROID_API}/android.jar"
          if [ ! -f "$PLATFORM_JAR" ]; then
            PLATFORM_JAR=$(ls $ANDROID_HOME/platforms/*/android.jar 2>/dev/null | tail -n 1)
          fi

          "$BT/aapt" package \
            -f \
            -M apk/AndroidManifest.xml \
            -S apk/res \
            -A apk/assets \
            -I "$PLATFORM_JAR" \
            -F XBattle-unsigned.apk

          cd apk
          "$BT/aapt" add ../XBattle-unsigned.apk lib/arm64-v8a/libmain.so
          cd ..

      - name: Create temporary signing key
        run: |
          keytool \
            -genkeypair \
            -v \
            -keystore xbattle-release.jks \
            -storetype JKS \
            -alias xbattle \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=XBattle,O=XBattle,C=IN"

      - name: Align and Sign APK
        run: |
          set -eux
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          if [ ! -f "$BT/zipalign" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | tail -n 1)
          fi

          "$BT/zipalign" -f -p 4 XBattle-unsigned.apk XBattle-aligned.apk

          "$BT/apksigner" sign \
            --ks xbattle-release.jks \
            --ks-key-alias xbattle \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out XBattle.apk \
            XBattle-aligned.apk

          "$BT/apksigner" verify --verbose XBattle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XBattle-Android-arm64
          path: XBattle.apk
          if-no-files-found: error
          retention-days: 7
